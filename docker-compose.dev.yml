services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: geoworkbench
      POSTGRES_USER: geoworkbench
      POSTGRES_PASSWORD: geoworkbench
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoworkbench -d geoworkbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geoworkbench}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geoworkbench123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geoworkbench}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geoworkbench123}
      MINIO_BUCKET: ${MINIO_BUCKET:-geoworkbench}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-geoworkbench} ${MINIO_ROOT_PASSWORD:-geoworkbench123}; do sleep 2; done;
      mc mb -p local/${MINIO_BUCKET:-geoworkbench};
      mc anonymous set none local/${MINIO_BUCKET:-geoworkbench};
      "

  backend:
    build:
      context: ./backend
    environment:
      GEOWORKBENCH_DATABASE_URL: postgresql+psycopg://geoworkbench:geoworkbench@postgres:5432/geoworkbench
      GEOWORKBENCH_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-5173}","http://127.0.0.1:${FRONTEND_PORT:-5173}"]'
      GEOWORKBENCH_UPLOAD_ROOT: /app/runtime-data/uploads
      GEOWORKBENCH_EXPORT_ROOT: /app/runtime-data/exports
      GEOWORKBENCH_OBJECT_STORAGE_PROVIDER: local
      GEOWORKBENCH_AI_PROVIDER: rule_based
      GEOWORKBENCH_REDIS_URL: redis://redis:6379/0
      GEOWORKBENCH_CACHE_ENABLED: "true"
      GEOWORKBENCH_CACHE_ENVIRONMENT: development
      GEOWORKBENCH_REALTIME_REDIS_ENABLED: "true"
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    volumes:
      - ./runtime-data:/app/runtime-data
      - "./MTSE-65(PBH 62):/app/MTSE-65(PBH 62):ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8081
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - ./docs:/docs:ro
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  redisinsight_data:
