name: Reliance UAT defect
description: Report a workflow, data, or UI issue found during Reliance UAT testing.
title: "[UAT] "
labels: ["uat", "qa"]
body:
  - type: input
    id: test_case
    attributes:
      label: Test case ID
      description: Example UAT-WB-02 or UAT-IMP-01.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Login/IAM
        - Dashboard/Map/PWA
        - Import
        - Workbench/LogWidget
        - AI/Validation
        - Correlation
        - Export
        - Mobile
        - Deployment/Health
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment URL
      placeholder: https://geowb.simproapps.in
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Borehole/display/template
      placeholder: MGCA-08 / Reliance Review Display / Corrected Lithology
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach screenshots, exported files, console logs, or API logs.
